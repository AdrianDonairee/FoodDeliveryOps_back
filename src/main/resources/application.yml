spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fooddeliveryops}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:foodops}
    password: ${SPRING_DATASOURCE_PASSWORD:foodops}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

  # 12-Factor App: Factor IX - Disposability (Tiempo de gracia para apagado seguro)
  lifecycle:
    timeout-per-shutdown-phase: 20s

# 12-Factor App: Factor IX - Disposability (Apagado Seguro / Graceful Shutdown)
server:
  port: ${PORT:8080}
  shutdown: graceful

app:
  jwt:
    secret: ${APP_JWT_SECRET:FoodDeliveryOps_ChangeThisSecret_AtLeast32Chars}
    access-token-minutes: ${APP_JWT_ACCESS_MINUTES:30}
    refresh-token-days: ${APP_JWT_REFRESH_DAYS:7}
  assignment:
    max-search-radius-km: ${APP_ASSIGNMENT_MAX_SEARCH_RADIUS_KM:15.0}
    max-gps-age-minutes: ${APP_ASSIGNMENT_MAX_GPS_AGE_MINUTES:60}
    offer-expiration-minutes: ${APP_ASSIGNMENT_OFFER_EXPIRATION_MINUTES:5}
    default-shop-lat: ${APP_ASSIGNMENT_DEFAULT_SHOP_LAT:-34.6177}
    default-shop-lng: ${APP_ASSIGNMENT_DEFAULT_SHOP_LNG:-68.3301}
    default-shop-address: ${APP_ASSIGNMENT_DEFAULT_SHOP_ADDRESS:Av. Mitre 340, San Rafael}

# Monitoreo y Metricas (Actuator)
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    enable:
      http.server.requests: true
  info:
    env:
      enabled: true

# Silenciar arranque de librerias y mostrar solo las peticiones de FoodDeliveryOps
logging:
  level:
    root: WARN
    com.adriandonaire.fooddeliveryops: INFO
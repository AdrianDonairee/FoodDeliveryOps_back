name: CI Pipeline - Build, Test & Security

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "fix/**"
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # =========================================================================
  # CONTINUOUS INTEGRATION (CI)
  # 1. Verification, Unit & Integration Tests, Packaging & Snyk Scan
  # =========================================================================
  test-and-verify:
    name: 1. Run Unit & Integration Tests (Maven + Snyk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Run Spring Boot Unit & Integration Tests
        run: ./mvnw clean test

      - name: Verify Package Build (JAR artifact)
        run: ./mvnw clean package -DskipTests

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/maven@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN || secrets.API_SNYK }}
        with:
          args: --severity-threshold=high

  # =========================================================================
  # 2. Grype - Vulnerability & Dependency Scanner (Anchore)
  # =========================================================================
  grype-scan:
    name: 2. Grype Vulnerability Scanner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Grype vulnerability scanner
        id: grype
        uses: anchore/scan-action@v6
        with:
          path: "."
          fail-build: false
          severity-cutoff: high

      - name: Upload Grype SARIF report to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always() && steps.grype.outputs.sarif != ''
        continue-on-error: true
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}

  # =========================================================================
  # 3. CodeQL - Static Application Security Testing (SAST)
  # =========================================================================
  codeql-analysis:
    name: 3. CodeQL SAST Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        continue-on-error: true
        with:
          languages: java-kotlin

      - name: Build Application for CodeQL
        run: ./mvnw clean compile -DskipTests

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        continue-on-error: true
        with:
          category: "/language:java-kotlin"

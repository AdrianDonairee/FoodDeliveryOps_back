name: CI Pipeline - Build & Test

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # =========================================================================
  # CONTINUOUS INTEGRATION (CI)
  # 1. Verification, Unit & Integration Tests, Packaging & Security Scan
  # =========================================================================
  test-and-verify:
    name: 1. Run Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Run Spring Boot Unit & Integration Tests
        run: ./mvnw clean test

      - name: Verify Package Build (JAR artifact)
        run: ./mvnw clean package -DskipTests

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/maven@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.API_SNYK }}
        with:
          args: --severity-threshold=high
